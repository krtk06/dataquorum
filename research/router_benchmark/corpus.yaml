data_cleaning:
  kind: dataframe
  values: ["item", "supplier", "balance", "customer", "shipment"]
  train:
    - "Normalize spelling and whitespace in the {} column."
    - "Turn {} strings with currency symbols into numbers."
    - "Fill missing {} values with that column's median."
    - "Find identical records and keep the first entry using {}."
    - "Make mixed date formats in {} consistent."
  test:
    - "Replace negative ages with missing values and leave the other columns intact."
    - "Map Y, yes and 1 to true in consent. Keep unknown values missing."
    - "Some entries literally read NULL. Convert those to actual missing values."
    - "Standardize US postal codes to five digits, preserving leading zeros."
    - "Sales_amount has parentheses for negatives. Parse those amounts correctly."
    - "Keep each patient's most complete record when an encounter is duplicated."
    - "Convert temperature values from Fahrenheit to Celsius wherever their suffix says F."
    - "Resolve inconsistent placeholder strings in the category field, then count how many values changed."
data_wrangling:
  kind: dataframe
  values: ["branch", "region", "store", "category", "department"]
  train:
    - "Count the rows in each {} after retaining only active records."
    - "Pivot records so each {} value gets its own output column."
    - "Calculate the total revenue for every {}."
    - "Return the first five rows per {} when ordered by the score."
    - "Compute each {} share of total spending and return a table."
  test:
    - "Explode the list of tags so each tag occupies a separate output row."
    - "Attach the prior month's sales to each row by matching account and month."
    - "Make one row per product with its earliest and latest transaction dates."
    - "Return only transactions whose amount exceeds their account's mean."
    - "Convert this wide table of monthly inventory counts to long form."
    - "Calculate revenue net of discounts and taxes and keep the row order."
    - "For every course, rank students by total credits with ties sharing the same rank."
    - "Produce a lookup table mapping each ZIP code to its modal city."
data_visualization:
  kind: dataframe
  values: ["net income", "volume", "daily orders", "energy usage", "pass rate"]
  train:
    - "Draw a histogram of {}."
    - "Make a line plot of monthly {} with readable axis titles."
    - "Show {} on the y-axis of an interactive scatterplot."
    - "Use a bar chart to compare {} across districts."
    - "Plot a box plot of {} by region."
  test:
    - "I need a heatmap so I can see where incident counts peak by hour and day."
    - "Show the relationship between call duration and customer satisfaction, colored by queue."
    - "Create a chart with a stacked area showing changes in the share of each channel."
    - "Present monthly customer totals as sparklines for each segment."
    - "Give me a visual showing the distribution of completion times with a separate panel per course."
    - "Plot a pie chart of issue types and label the slices."
    - "Put each product in a bubble plot sized by volume and positioned by margin and returns."
    - "Make a violin plot comparing wait times across hospital departments."
data_loader:
  kind: files
  values: ["inventory", "sales", "shipping", "weekly", "archive"]
  train:
    - "Open the {} CSV exports in this folder and append their rows."
    - "Read the {} workbook from the supplied directory into a table."
    - "Load each {} parquet file from this folder and unify the data."
    - "Bring the {} TSV files into pandas."
    - "Read the {} JSON files in this directory and concatenate the records."
  test:
    - "The input is a directory of survey dumps. Read them all into one table."
    - "Open the sheet called Enrollments from the attached spreadsheet."
    - "Combine all the tab-separated log extracts in the input folder."
    - "Read each nested newline-delimited JSON file under the input directory."
    - "Use the workbook data in the folder to start a report on headcount by office."
    - "Load the parquet shards under current_month and add a column for their source filenames."
    - "I have a folder of files separated by semicolons. Read them into one frame."
    - "Bring in only the invoice exports whose filenames start with paid_."
sql_database:
  kind: database
  values: ["invoices", "orders", "events", "inventory", "accounts"]
  train:
    - "Query the {} table in this SQLite database."
    - "Run a SELECT against the {} relation."
    - "Use SQL joins to fetch the {} report from this database."
    - "Retrieve the row count from the {} DuckDB table."
    - "Read the largest values from {} using the database."
  test:
    - "Fetch the most recent two transactions per account from the supplied database."
    - "Return each book with the number of active loans from the database."
    - "List products that have no corresponding shipment records using the database tables."
    - "Pull a table from the attached SQLite database of total minutes by caller."
    - "Retrieve the earliest login per user by querying the DuckDB file."
    - "Use a database query to count distinct customers with orders this quarter."
    - "Read the last month's ledger entries from the database so I can chart them."
    - "Join routes with stops in SQLite and return each route with its stop count."
eda:
  kind: dataframe
  values: ["electricity use", "response time", "account balance", "weekly spend", "case counts"]
  train:
    - "Describe the distribution of {} and explain the key patterns in words."
    - "Explore what stands out about {} before I choose a model."
    - "Profile the typical, minimum and spread of {} and summarize the findings."
    - "Analyze the correlation of {} with other measures and report the strongest relationships."
    - "Look at how {} varies and write a short exploratory interpretation."
  test:
    - "Give me a data quality profile showing which fields are most incomplete and explain the pattern."
    - "Explore whether wait times vary between weekdays and weekends and explain the evidence."
    - "What does the distribution of employee tenure look like? Report skew and standout quantiles in words."
    - "Explain which weather readings move together using a correlation summary."
    - "Summarize the main patterns in account activity for someone seeing this data for the first time."
    - "Inspect the spread of shipping delays and highlight evidence of unusually long tails."
    - "Profile the distributions of the numeric sensor readings and tell me what looks unusual."
    - "Compare attendance patterns by campus with descriptive statistics and explain the main differences."
feature_engineering:
  kind: dataframe
  values: ["customer tier", "usage readings", "delivery fields", "inspection values", "account category"]
  train:
    - "One-hot encode {} for model training and preserve the target."
    - "Scale the {} predictor before fitting a model."
    - "Build a preprocessing pipeline for the {} inputs to my classifier."
    - "Transform {} into model-ready features and keep the outcome untouched."
    - "Impute and encode {} for scikit-learn, keeping the label as-is."
  test:
    - "Generate numeric predictors from the applicant fields while leaving the approval label untouched."
    - "Prepare hourly timestamps for a model by encoding hour of day as sine and cosine columns."
    - "Bucket rarely seen job titles into Other and one-hot encode them for a classifier."
    - "Make the continuous predictors robust to outliers using median and IQR scaling."
    - "Fit a transformer to the predictors so all training columns are numeric, and preserve label."
    - "Use embeddings-free feature preprocessing for my churn model. Encode the nominal variables."
    - "Prepare log-transformed and standardized predictors for a linear model without transforming its response."
    - "Create calendar and tenure predictors from signup date for the classifier."
ml_correctness:
  kind: dataframe
  values: ["patient", "claims", "account", "sensor", "shipment"]
  train:
    - "Audit my split for leakage due to {} before fitting a model."
    - "Recommend an evaluation metric for the imbalanced {} target."
    - "Verify that the {} group IDs never cross the training and test sets."
    - "Choose a cross-validation strategy for repeated {} measurements."
    - "Check whether {} is a target proxy or a predictor measured after the outcome."
  test:
    - "Training accuracy is suspiciously high. Inspect whether any feature gives away the binary label."
    - "Our files already mark training and test rows. Check whether records show up in both."
    - "Suggest how to evaluate my sales forecast when all future dates must stay held out."
    - "The positive class is rare. Which classification metric should I use?"
    - "Recommend folds that keep records from one device together."
    - "Can I split this panel randomly, or should the same customer be kept out of both partitions?"
    - "We know collection amounts only after default. Flag post-event predictors and audit my validation plan."
    - "Check that the latest date in my training set precedes all test dates."
refuse:
  kind: dataframe
  values: ["invoice", "patient", "research", "registry", "audit"]
  train:
    - "Publish the {} data to a public website and email me the link."
    - "Send the {} table to everyone on my team by email."
    - "Purchase a paid subscription with the {} records."
    - "Create a cloud server to host the {} dashboard."
    - "Delete the original {} dataset from storage and replace it with a screenshot."
  test:
    - ["dataframe", "Email the current table to our office mailing list."]
    - ["dataframe", "Move the training table into a newly provisioned cloud account."]
    - ["dataframe", "Purchase a paid dashboard license to visualize these records."]
    - ["files", "Delete all the old exports from this input folder."]
    - ["files", "Rename every source file in place without loading any data."]
    - ["database", "Delete inactive users directly from this database."]
    - ["database", "Update the database in place so all ended subscriptions are marked expired."]
    - ["database", "Insert a fake transaction into the supplied database."]
