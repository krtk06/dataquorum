# Week 9: loader, SQL, EDA and feature-engineering tasks. Folder and database inputs are
# built from the clean sample (evals/inputs.py), so every answer is known.
defaults:
  rows: 300
  tags: [week9]

tasks:
  # ---------------------------------------------------------------- loader
  - id: load-adult-semicolon
    agent: data_loader
    dataset: adult
    columns: [age, education, hours-per-week, sex]
    rows: 200
    files: [{path: adult.csv, sep: ";"}]
    request: Load adult.csv into a table.
    checks:
      - {kind: row_count}
      - {kind: matches_expected, columns: [age, education, hours-per-week, sex]}

  - id: load-credit-notes-decimal-comma
    agent: data_loader
    dataset: credit-g
    columns: [purpose, credit_amount, duration]
    rows: 200
    files:
      - {path: credit.csv, sep: ";", decimal: ",", preamble: ["Credit export", "Generated by the loan system"]}
    request: >-
      Load credit.csv. It uses ";" as the separator and a decimal comma, and has two note
      lines above the header.
    checks:
      - {kind: row_count}
      - {kind: matches_expected, columns: [purpose, credit_amount, duration]}

  - id: load-telco-monthly-parts
    agent: data_loader
    dataset: telco-customer-churn
    columns: [tenure, Contract, MonthlyCharges]
    files:
      - {path: parts/2025-01.csv, rows: [0, 100]}
      - {path: parts/2025-02.csv, rows: [100, 200]}
      - {path: parts/2025-03.csv, rows: [200, 300]}
    request: Load all CSV files in the parts folder into one table, stacked in file-name order.
    checks:
      - {kind: row_count}
      - {kind: matches_expected, columns: [tenure, Contract, MonthlyCharges]}

  - id: load-ames-excel-sheet
    agent: data_loader
    dataset: ames-housing
    columns: [Neighborhood, Gr_Liv_Area, Sale_Price]
    rows: 150
    files: [{path: ames.xlsx, format: excel, sheet: houses, extra_sheets: [notes]}]
    request: Load the houses sheet of ames.xlsx.
    checks:
      - {kind: row_count}
      - {kind: matches_expected, columns: [Neighborhood, Gr_Liv_Area, Sale_Price]}

  - id: load-diabetes-json
    agent: data_loader
    dataset: diabetes
    rows: 200
    files: [{path: patients.json, format: json}]
    request: Load patients.json (a list of records) into a table.
    checks:
      - {kind: row_count}
      - {kind: matches_expected, columns: [plas, mass, age, class]}

  - id: load-adult-tsv-ignore-archive
    agent: data_loader
    dataset: adult
    columns: [age, occupation, hours-per-week]
    rows: 200
    files:
      - {path: data.tsv, format: tsv}
      - {path: archive/data_2019.tsv, format: tsv, decoy: true}
      - {path: README.txt, format: text, text: "data.tsv is the current extract; archive/ holds old ones.\n"}
    request: Load the current extract, data.tsv. Do not include the archived files.
    checks:
      - {kind: row_count}
      - {kind: matches_expected, columns: [age, occupation, hours-per-week]}

  - id: load-impossible-missing-file
    agent: data_loader
    dataset: credit-g
    columns: [purpose, credit_amount]
    files: [{path: sales_2024.csv}]
    request: Load customers_2024.csv.
    expect_status: failed
    tags: [impossible]
    checks:
      - {kind: no_output}

  # ---------------------------------------------------------------- SQL
  - id: sql-adult-hours-by-education
    agent: sql_database
    dataset: adult
    columns: [education, hours-per-week, sex]
    rows: 400
    database: {table: people}
    request: >-
      Average hours-per-week for each education level. Return columns education and
      avg_hours.
    checks:
      - {kind: aggregate, group_by: education, value: hours-per-week, agg: mean}

  - id: sql-credit-amount-by-purpose-join
    agent: sql_database
    dataset: credit-g
    columns: [purpose, credit_amount, duration]
    database: {table: loans, lookups: [{column: purpose, table: purposes}]}
    request: >-
      Total credit_amount for each purpose name (the names are in the purposes table). Return
      columns purpose and total_amount.
    checks:
      - {kind: aggregate, group_by: purpose, value: credit_amount, agg: sum}

  - id: sql-telco-churned-by-contract
    agent: sql_database
    dataset: telco-customer-churn
    columns: [Contract, Churn, tenure]
    rows: 600
    database: {table: customers}
    request: >-
      Number of customers who churned (Churn is "Yes") for each Contract type. Return columns
      Contract and churned.
    checks:
      - {kind: aggregate, group_by: Contract, value: tenure, agg: count, query: "Churn == 'Yes'"}

  - id: sql-ames-top5-average-price
    agent: sql_database
    dataset: ames-housing
    columns: [Neighborhood, Sale_Price]
    rows: 800
    database: {table: houses}
    request: >-
      The 5 neighborhoods with the highest average Sale_Price, highest first. Return columns
      Neighborhood and avg_price.
    checks:
      - {kind: aggregate, group_by: Neighborhood, value: Sale_Price, agg: mean, top: 5, order: desc}

  - id: sql-diabetes-older-positive
    agent: sql_database
    dataset: diabetes
    database: {table: patients}
    request: Return all columns for patients older than 50 whose class is tested_positive.
    checks:
      - {kind: filter_rows, query: "age > 50 and `class` == 'tested_positive'", key: pedi}

  - id: sql-credit-renters-long-loans-join
    agent: sql_database
    dataset: credit-g
    columns: [housing, duration, credit_amount]
    database: {table: loans, lookups: [{column: housing, table: housing_types}]}
    request: >-
      Loans of applicants whose housing type is "rent" (names are in housing_types) with a
      duration over 24 months. Include the credit_amount column.
    checks:
      - {kind: filter_rows, query: "housing == 'rent' and duration > 24", key: credit_amount}

  - id: sql-adult-count-by-sex-and-race
    agent: sql_database
    dataset: adult
    columns: [sex, race, age]
    rows: 500
    database: {table: people}
    request: Number of people for each combination of sex and race. Return columns sex, race and n.
    checks:
      - {kind: aggregate, group_by: [sex, race], value: age, agg: count}

  - id: sql-impossible-delete
    agent: sql_database
    dataset: adult
    columns: [age, education]
    database: {table: people}
    request: Delete everyone older than 60 from the people table.
    expect_status: failed
    tags: [impossible]
    checks:
      - {kind: no_output}

  - id: sql-impossible-missing-table
    agent: sql_database
    dataset: telco-customer-churn
    columns: [Contract, MonthlyCharges]
    database: {table: customers}
    request: Total sales revenue by region from the orders table.
    expect_status: failed
    tags: [impossible]
    checks:
      - {kind: no_output}

  # ---------------------------------------------------------------- EDA
  - id: eda-adult-missing-per-column
    agent: eda
    dataset: adult
    columns: [age, workclass, occupation, native-country, hours-per-week]
    rows: 600
    request: How many missing values does each column have?
    checks:
      - {kind: per_column_stat, stat: missing, columns: [age, workclass, occupation, native-country, hours-per-week]}

  - id: eda-credit-numeric-means
    agent: eda
    dataset: credit-g
    columns: [duration, credit_amount, age, purpose]
    request: The mean of each numeric column. Do not round.
    checks:
      - {kind: per_column_stat, stat: mean, columns: [duration, credit_amount, age]}

  - id: eda-telco-churn-rate-by-contract
    agent: eda
    dataset: telco-customer-churn
    columns: [Contract, Churn]
    rows: 800
    request: Churn rate in percent (share of customers with Churn "Yes") for each Contract type. Do not round.
    checks:
      - {kind: aggregate, group_by: Contract, value: churn_pct, value_expr: "(Churn == 'Yes') * 100", agg: mean}

  - id: eda-diabetes-median-glucose-by-class
    agent: eda
    dataset: diabetes
    request: Median plas for each class.
    checks:
      - {kind: aggregate, group_by: class, value: plas, agg: median}

  - id: eda-ames-area-price-correlation
    agent: eda
    dataset: ames-housing
    columns: [Gr_Liv_Area, Sale_Price, Neighborhood]
    rows: 800
    request: What is the Pearson correlation between Gr_Liv_Area and Sale_Price? Do not round.
    checks:
      - {kind: correlation, x: Gr_Liv_Area, y: Sale_Price}

  - id: eda-adult-top-occupations
    agent: eda
    dataset: adult
    columns: [occupation, age]
    rows: 800
    request: The 5 most common occupations and how many people have each, most common first. Ignore missing occupations.
    checks:
      - {kind: aggregate, group_by: occupation, value: age, agg: count, query: "occupation.notna()", top: 5, order: desc}

  - id: eda-credit-distinct-values
    agent: eda
    dataset: credit-g
    columns: [purpose, housing, job, savings_status, credit_amount]
    request: The number of distinct values in each of these columns - purpose, housing, job, savings_status.
    checks:
      - {kind: per_column_stat, stat: nunique, columns: [purpose, housing, job, savings_status]}

  # ---------------------------------------------------------------- feature engineering
  - id: fe-adult-onehot-and-scale
    agent: feature_engineering
    dataset: adult
    columns: [age, hours-per-week, sex, race, class]
    request: >-
      Prepare features for a model. The target column is class. One-hot encode sex and race,
      standardise age and hours-per-week, and keep every row.
    checks:
      - {kind: row_count}
      - {kind: column_unchanged, column: class}
      - {kind: onehot, column: sex}
      - {kind: onehot, column: race}
      - {kind: standardized, columns: [age, hours-per-week]}
      - {kind: all_numeric, except_columns: [class]}

  - id: fe-credit-impute-then-scale
    agent: feature_engineering
    dataset: credit-g
    columns: [credit_amount, duration, age, housing, class]
    faults: [{kind: missing, column: credit_amount, frac: 0.1, expect: median}]
    request: >-
      Prepare features. The target column is class. Fill missing credit_amount with the
      median, then standardise credit_amount, duration and age, and one-hot encode housing.
    checks:
      - {kind: column_unchanged, column: class}
      - {kind: standardized, columns: [credit_amount, duration, age]}
      - {kind: onehot, column: housing}
      - {kind: all_numeric, except_columns: [class]}

  - id: fe-telco-churn-features
    agent: feature_engineering
    dataset: telco-customer-churn
    columns: [tenure, MonthlyCharges, Contract, PaymentMethod, Churn]
    rows: 500
    request: >-
      Model-ready features. The target column is Churn. One-hot encode Contract and
      PaymentMethod and standardise tenure and MonthlyCharges.
    checks:
      - {kind: column_unchanged, column: Churn}
      - {kind: onehot, column: Contract}
      - {kind: onehot, column: PaymentMethod}
      - {kind: standardized, columns: [tenure, MonthlyCharges]}
      - {kind: all_numeric, except_columns: [Churn]}

  - id: fe-diabetes-standardise-all
    agent: feature_engineering
    dataset: diabetes
    request: The target column is class. Standardise every other column.
    checks:
      - {kind: column_unchanged, column: class}
      - {kind: standardized, columns: [preg, plas, pres, skin, insu, mass, pedi, age]}
      - {kind: all_numeric, except_columns: [class]}

  - id: fe-ames-onehot-building-type
    agent: feature_engineering
    dataset: ames-housing
    columns: [Gr_Liv_Area, Year_Built, Bldg_Type, Sale_Price]
    request: >-
      The target column is Sale_Price. One-hot encode Bldg_Type and standardise Gr_Liv_Area
      and Year_Built.
    checks:
      - {kind: column_unchanged, column: Sale_Price}
      - {kind: onehot, column: Bldg_Type}
      - {kind: standardized, columns: [Gr_Liv_Area, Year_Built]}
      - {kind: all_numeric, except_columns: [Sale_Price]}

  - id: fe-credit-leakage-trap
    agent: feature_engineering
    dataset: credit-g
    columns: [purpose, housing, duration, class]
    request: >-
      Prepare features for a classifier. The target column is class. One-hot encode every
      text column.
    checks:
      - {kind: column_unchanged, column: class}
      - {kind: onehot, column: purpose}
      - {kind: onehot, column: housing}
      - {kind: all_numeric, except_columns: [class]}

  - id: fe-adult-minmax
    agent: feature_engineering
    dataset: adult
    columns: [age, hours-per-week, education-num, class]
    request: >-
      The target column is class. Scale age, hours-per-week and education-num to the range 0
      to 1 (min-max scaling).
    checks:
      - {kind: column_unchanged, column: class}
      - {kind: minmax, columns: [age, hours-per-week, education-num]}
      - {kind: all_numeric, except_columns: [class]}

  - id: fe-impossible-missing-target
    agent: feature_engineering
    dataset: adult
    columns: [age, sex, class]
    request: Prepare features for predicting income_usd. The target column is income_usd.
    expect_status: failed
    tags: [impossible]
    checks:
      - {kind: no_output}
