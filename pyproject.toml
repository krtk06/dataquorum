[project]
name = "dataquorum"
version = "1.0.0"
description = "A team of AI data-science agents that must prove their work."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "krtk06" }]
requires-python = ">=3.12,<3.13"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "docker>=7.2.0",
    "duckdb>=2.0.0",
    "httpx2>=2.16",
    "langgraph>=1.2.22",
    "openai>=3.51.0",
    "pandas>=2.2,<3",
    "plotly>=7.1.0",
    "pyarrow>=26.0.1",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "sqlglot>=30.31.0",
]

[project.urls]
Repository = "https://github.com/krtk06/dataquorum"
Changelog = "https://github.com/krtk06/dataquorum/blob/main/CHANGELOG.md"
Documentation = "https://github.com/krtk06/dataquorum#readme"

[project.optional-dependencies]
routing = [
    "onnxruntime>=1.24,<2",
    "scikit-learn>=1.9.1,<2",
    "tokenizers>=0.22,<1",
]
serving = [
    "fastapi>=0.135,<1",
    "mlflow>=3.10,<4",
    "scikit-learn==1.9.1",
    "skops==0.16.0",
    "uvicorn>=0.40,<1",
]
studio = [
    "streamlit>=1.57,<2",
]

[project.scripts]
dataquorum-studio = "dataquorum.app.launch:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.format]
# Code blocks in docs are sketches (aligned comments, placeholders), not runnable code.
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "scripts", "research"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["docker: needs Docker and the dataquorum/sandbox image (skipped otherwise)"]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "openpyxl>=3.1.5",
    "pandas-stubs>=2.2,<3",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "statsmodels>=0.15.0",
    "types-docker>=7.2.0.20261102",
    "types-pyyaml>=6.0.12.20261113",
]
evals = [
    "openml>=0.15.1",
]

[[tool.mypy.overrides]]
module = ["plotly", "plotly.*"]
ignore_missing_imports = true

[tool.ruff.lint.isort]
known-third-party = ["docker"]

[tool.ruff.lint.per-file-ignores]
# Escape probes are code strings that read best on one line each.
"tests/sandbox/test_escapes.py" = ["E501"]
# Checkers compare values in compact one-line expressions.
"src/dataquorum/evals/checkers.py" = ["E501"]
"src/dataquorum/evals/scoring.py" = ["E501"]
"src/dataquorum/evals/runner.py" = ["E501"]
"src/dataquorum/evals/compare.py" = ["E501"]
"src/dataquorum/evals/oracle.py" = ["E501"]
"src/dataquorum/evals/faults.py" = ["E501"]
"src/dataquorum/sandbox/sql_executor.py" = ["E501"]
"src/dataquorum/evals/parity/run.py" = ["E501"]
"images/original/worker.py" = ["E501"]
"tests/test_evals.py" = ["E501"]
"tests/test_sql.py" = ["E501"]
"tests/test_loader.py" = ["E501"]
"tests/test_findings.py" = ["E501"]
"tests/test_features.py" = ["E501"]
"tests/test_automl_bench.py" = ["E501"]
"src/dataquorum/agents/features.py" = ["E501"]
"src/dataquorum/evals/checkers_ml.py" = ["E501"]
"src/dataquorum/ml/automl/benchmark.py" = ["E501"]
"tests/sandbox/test_docker_executor.py" = ["E501"]

[[tool.mypy.overrides]]
module = ["openml", "openml.*", "statsmodels", "statsmodels.*", "scipy", "scipy.*",
          "streamlit", "streamlit.*",
          "onnxruntime", "tokenizers",
          "evidently", "evidently.*", "mlflow", "mlflow.*", "skops", "skops.*",
          "fastapi", "fastapi.*", "uvicorn",
          "optuna", "shap", "flaml", "flaml.*", "h2o", "h2o.*", "autogluon", "autogluon.*", "sklearn", "sklearn.*"]
ignore_missing_imports = true
