name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, ${{ matrix.pandas }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        pandas: ["pandas 2"]
        include:
          - os: ubuntu-latest
            pandas: "pandas 3"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Type-check
        run: uv run mypy
      - name: Test
        if: matrix.pandas == 'pandas 2'
        run: uv run pytest
      - name: Test against pandas 3
        if: matrix.pandas == 'pandas 3'
        run: uv run --with "pandas>=3" pytest

  sandbox:
    name: sandbox escape tests (Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - name: Build the sandbox image
        run: docker build -t dataquorum/sandbox:0.2 images/sandbox
      - name: Install
        run: uv sync --locked
      - name: Escape and executor tests
        # Fails if the image is missing instead of silently skipping.
        run: |
          docker image inspect dataquorum/sandbox:0.2 > /dev/null
          uv run pytest -m docker -v
