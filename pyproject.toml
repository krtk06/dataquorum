[project]
name = "dataquorum"
version = "0.0.1"
description = "A team of AI data-science agents that must prove their work."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "krtk06" }]
requires-python = ">=3.12,<3.13"
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "openai>=3.51.0",
    "pandas>=2.2,<3",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
]

[project.urls]
Repository = "https://github.com/krtk06/dataquorum"

[build-system]
requires = ["uv_build>=0.13.8,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pandas-stubs>=2.2,<3",
    "pytest>=9.2.0",
    "pytest-recording>=0.15.0",
    "ruff>=0.17.5",
]
